[project]
name = "riskplat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishnapatel-03", email = "patelkrishna3445@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "onnxruntime>=1.32.0",
    "pandas>=3.1.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "structlog>=26.1.0",
]

[project.scripts]
riskplat = "riskplat:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pandera>=0.36.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "testcontainers>=4.15.0",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplification
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"



[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true



[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
